name: Action

on:
  push:
    branches: [main]
    paths: ["action.yml", ".github/workflows/action-test.yml"]
  pull_request:
    paths: ["action.yml", ".github/workflows/action-test.yml"]
  workflow_dispatch:

jobs:
  # The action itself needs testing, not just the binary it wraps: a broken
  # bundle must actually fail the step, or the dogfooding gate proves nothing.
  behaviour:
    name: Action fails on a broken bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build okf
        run: cargo build --release --locked -p okft

      - name: Passes on a conformant bundle
        uses: ./
        with:
          path: tests/fixtures/upstream/acme_retail
          binary: target/release/okf

      # Guards the `okf-version` input specifically: this bundle is written the
      # v0.1 way, so a strict lint only passes if the input reached the binary.
      - name: Create a v0.1 bundle
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/legacy"
          printf -- '# Bundle\n\n* [a](a.md)\n' > "${RUNNER_TEMP}/legacy/index.md"
          printf -- '---\ntype: Metric\ntitle: A\ndescription: D\ntimestamp: %s\n---\n\n# Citations\n\n- https://example.com\n' \
            "'2026-05-28T22:53:05+00:00'" > "${RUNNER_TEMP}/legacy/a.md"

      - name: Passes a v0.1 bundle when told to target v0.1
        uses: ./
        with:
          path: ${{ runner.temp }}/legacy
          command: lint
          strict: "true"
          okf-version: "0.1"
          binary: target/release/okf

      - name: Create a bundle with a missing `type`
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/broken"
          printf -- '---\ntitle: No type field\n---\n' > "${RUNNER_TEMP}/broken/a.md"

      - name: Fails on a non-conformant bundle
        id: broken
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/broken
          binary: target/release/okf

      - name: Assert the previous step failed
        shell: bash
        run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "::error::the action passed a bundle with no \`type\` field" >&2
            exit 1
          fi
          echo "The action correctly failed the broken bundle."

  # The `binary` input above bypasses the download, so the path real consumers
  # take was never exercised until a release existed. This uses the action the
  # way the README documents it, with no local build at all.
  download:
    name: Action downloads a released binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Validate using the published release
        uses: ./
        with:
          path: tests/fixtures/upstream/ga4
          version: v0.1.0
