name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # GitHub resolves `uses: owner/repo@ref` against the repository root, and
      # a Marketplace listing requires the metadata there too. Moving this file
      # breaks every consumer silently: the action tests reference the action by
      # local path, so they keep passing. This runs in Lint because Lint is a
      # required check on every pull request.
      - name: Action metadata stays at the repository root
        run: |
          if [ ! -f action.yml ]; then
            echo "::error::action.yml must stay at the repository root, or" \
                 "uses: galkleinman/okf-toolkit@<tag> cannot resolve it" >&2
            exit 1
          fi
          if [ -e action/action.yml ]; then
            echo "::error::action/action.yml is back; the root copy is the one" \
                 "consumers resolve, so two copies will drift" >&2
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.90"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  coverage:
    name: Coverage (100% gate)
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Enforce 100% line coverage
        run: >
          cargo llvm-cov --workspace --all-features --locked
          --lcov --output-path lcov.info
          --fail-under-lines 100
      # Reporting, not the gate: the step above is what enforces 100%. Skipped
      # when no token is configured so a fork or a fresh clone still goes green,
      # and non-fatal otherwise -- a Codecov outage or an unonboarded repository
      # must not fail a build whose coverage gate passed. Failures still surface
      # as a warning annotation on the run.
      - uses: codecov/codecov-action@v7
        if: env.CODECOV_TOKEN != ''
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
