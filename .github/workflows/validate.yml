name: Validate knowledge bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dogfooding: this repository's own documentation is an OKF bundle, checked
  # by the action this repository publishes, using the binary it ships.
  validate:
    name: okf validate ./knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build okf
        run: cargo build --release --locked -p okft

      - name: Validate the bundle
        uses: ./action
        with:
          path: knowledge
          command: lint
          strict: "true"
          binary: target/release/okf
